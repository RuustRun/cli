# Release the ruust CLI with GoReleaser: on a v* tag it cross-compiles macOS and
# Linux binaries, publishes a GitHub release (archives + checksums), and updates the
# Homebrew formula in RuustRun/homebrew-tap (when HOMEBREW_TAP_TOKEN is set), so the
# CLI installs with: brew install ruustrun/tap/ruust
# British English. No em dashes.

name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history (tags and changelog).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with write access to RuustRun/homebrew-tap. When unset the brew
          # step is skipped (see .goreleaser.yaml) and only the binaries publish.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
