# Build the ruust CLI for macOS and Linux (amd64 and arm64) and publish the
# binaries to a GitHub Release. Trigger by pushing a tag (v*), or run manually with
# a version. British English. No em dashes.

name: Release CLI binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Resolve version
        id: v
        run: |
          VER="${GITHUB_REF_NAME}"
          if [ -z "${VER}" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/RuustRun/cli/internal/commands.Version=${{ steps.v.outputs.version }}"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "$LDFLAGS" -o "dist/ruust-$os-$arch" .
            done
          done
          ls -l dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ruust-*
